<!doctype html>
<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: #111111; line-height: 1.5;">
    <h2 style="margin: 0 0 12px;">Sign in to Derrick Valentine</h2>
    <p style="margin: 0 0 8px;">Enter this 6-digit code to finish signing in:</p>
    <p style="font-size: 28px; font-weight: 700; letter-spacing: 4px; margin: 0 0 20px;">{{ .Token }}</p>
    <p style="margin: 0 0 8px;">Or click here to sign in:</p>
    <p style="margin: 0 0 20px;">
      <a href="{{ .ConfirmationURL }}" style="color: #2563eb;">Sign in</a>
    </p>
    <p style="margin: 0; font-size: 13px; color: #666666;">
      This code expires in 1 hour. If you did not request it, you can ignore this email.
    </p>
  </body>
</html>
